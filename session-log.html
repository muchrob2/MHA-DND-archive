<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Session-by-session play log for the MHA D&D campaign — recaps, XP awarded, and loot gained.">
<meta name="theme-color" content="#08090D">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Session Log — MHA D&D</title>
<link rel="preload" href="css/fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="css/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/manga.css">
<link rel="stylesheet" href="css/pages/session-log.css">
<link rel="stylesheet" href="css/auth-widget.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
</head>
<body>

<nav id="topnav">
  <a id="back-btn" href="index.html">← Dashboard</a>
  <span class="nav-title">Session Log</span>
  <div class="nav-right">
    <span class="nav-saved" id="saved-notice">Saved ✓</span>
    <button class="nav-btn save-btn" id="add-session-btn" onclick="openNewForm()" style="display:none;">+ New Session</button>
  </div>
</nav>

<div id="load-error-banner" style="display:none;">
  <div class="banner-inner">Couldn't load the session log from the server. Reload to try again.</div>
</div>

<div id="summary-bar">
  <div class="summary-stat"><div class="summary-stat-label">Sessions logged</div><div class="summary-stat-value" id="stat-count">0</div></div>
  <div class="summary-stat"><div class="summary-stat-label">Total XP awarded</div><div class="summary-stat-value" id="stat-xp">0</div></div>
</div>

<div id="panel">
  <div id="new-form-slot"></div>
  <div id="sessions-list"></div>
  <div id="empty-state" style="display:none;">
    <div class="es-icon">📓</div>
    No sessions logged yet — recap your first session to start the log.
  </div>
</div>

<script src="session-log.js"></script>
</body>
</html>
