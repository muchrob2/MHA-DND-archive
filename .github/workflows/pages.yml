name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate campaign/character JSON
        run: |
          python3 -c "
          import json, glob, sys
          files = glob.glob('CAMPAIGN/*.json') + glob.glob('CLASS-1A/*.json')
          bad = []
          for f in files:
              try:
                  with open(f, encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('Malformed JSON:')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'{len(files)} JSON files OK')
          "

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
