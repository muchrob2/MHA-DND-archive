<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Session-by-session play log for the MHA D&D campaign — recaps, XP awarded, and loot gained.">
<meta name="theme-color" content="#0C1017">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Session Log — MHA D&D</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0C1017; --surface: #111923; --surface2: #18222E;
    --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.14);
    --text: #E8EDF3; --text-muted: #8A9BB0; --text-dim: #3E5068;
    --gold: #E8A020; --gold-light: rgba(232,160,32,0.13); --gold-text: #F5C842;
    --teal: #0EA572; --teal-light: rgba(14,165,114,0.13); --teal-text: #5FDBAA;
    --red: #EF4444; --red-light: rgba(239,68,68,0.13); --red-text: #FCA5A5;
    --radius: 10px; --radius-lg: 14px;
    --nav-h: 48px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  #topnav {
    position: sticky; top: 0; z-index: 100; height: var(--nav-h);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0;
  }
  #back-btn {
    display: flex; align-items: center; gap: 6px; padding: 0 16px;
    font-size: 13px; color: var(--text-muted); text-decoration: none;
    border-right: 1px solid var(--border); height: 100%; white-space: nowrap; flex-shrink: 0;
  }
  #back-btn:hover { color: var(--gold-text); background: var(--gold-light); }
  .nav-title { padding: 0 16px; font-size: 13px; font-weight: 700; color: var(--text); flex: 1; }
  .nav-right { display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .nav-btn {
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface2); color: var(--text-muted);
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .nav-btn:hover { color: var(--text); border-color: rgba(232,160,32,0.4); }
  .nav-btn.save-btn { background: rgba(14,165,114,0.12); color: var(--teal-text); border-color: rgba(14,165,114,0.25); }
  .nav-btn.save-btn:hover { background: rgba(14,165,114,0.2); }
  .nav-saved { font-size: 11px; color: var(--teal-text); opacity: 0; transition: opacity 0.4s; }
  .nav-saved.show { opacity: 1; }

  #load-error-banner { max-width: 820px; margin: 14px auto 0; padding: 0 24px; }
  #load-error-banner .banner-inner {
    background: var(--red-light); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius);
    padding: 10px 14px; font-size: 12px; color: var(--red-text);
  }

  #summary-bar {
    max-width: 820px; margin: 20px auto 0; padding: 0 24px;
    display: flex; gap: 20px; flex-wrap: wrap;
  }
  .summary-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; }
  .summary-stat-label { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; }
  .summary-stat-value { font-size: 18px; font-weight: 800; color: var(--gold-text); }

  #panel { max-width: 820px; margin: 0 auto; padding: 16px 24px 80px; }

  .session-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px 24px; margin-top: 14px;
  }
  .session-card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .session-number {
    font-size: 11px; font-weight: 700; color: var(--gold-text); background: var(--gold-light);
    border: 1px solid rgba(232,160,32,0.3); border-radius: 6px; padding: 3px 9px; letter-spacing: 0.03em;
  }
  .session-title { font-size: 16px; font-weight: 800; flex: 1; min-width: 120px; }
  .session-date { font-size: 12px; color: var(--text-dim); }
  .session-recap { font-size: 13px; color: var(--text); white-space: pre-wrap; line-height: 1.7; margin-bottom: 14px; }
  .session-meta-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 6px; }
  .session-meta-block { flex: 1; min-width: 180px; }
  .session-meta-label { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .xp-value { font-size: 15px; font-weight: 800; color: var(--teal-text); }
  .loot-text { font-size: 13px; color: var(--text-muted); white-space: pre-wrap; line-height: 1.6; }
  .session-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .action-btn {
    padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface2); color: var(--text-muted);
    transition: background 0.1s, color 0.1s;
  }
  .action-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .action-btn.primary { background: var(--teal-light); color: var(--teal-text); border-color: rgba(14,165,114,0.4); }
  .action-btn.danger { color: var(--red-text); border-color: rgba(239,68,68,0.25); }
  .action-btn.danger:hover { background: var(--red-light); }

  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 5px; }
  .edit-input, .edit-textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border-strong);
    border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 9px 12px;
    outline: none; font-family: inherit; transition: border-color 0.15s;
  }
  .edit-input:focus, .edit-textarea:focus { border-color: rgba(232,160,32,0.5); }
  .edit-textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .form-row-pair { display: flex; gap: 12px; }
  .form-row-pair .form-row { flex: 1; }
  .form-actions { display: flex; gap: 8px; margin-top: 14px; }

  #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 30px; text-align: center; color: var(--text-dim); }
  #empty-state .es-icon { font-size: 36px; margin-bottom: 14px; }

  @media (max-width: 640px) {
    #panel, #summary-bar, #load-error-banner { padding-left: 16px; padding-right: 16px; }
    .form-row-pair { flex-direction: column; gap: 0; }
  }

  .action-btn:focus-visible, .edit-input:focus-visible, .edit-textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
</style>
<link rel="stylesheet" href="css/auth-widget.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
</head>
<body>

<nav id="topnav">
  <a id="back-btn" href="index.html">← Dashboard</a>
  <span class="nav-title">Session Log</span>
  <div class="nav-right">
    <span class="nav-saved" id="saved-notice">Saved ✓</span>
    <button class="nav-btn save-btn" id="add-session-btn" onclick="openNewForm()" style="display:none;">+ New Session</button>
  </div>
</nav>

<div id="load-error-banner" style="display:none;">
  <div class="banner-inner">Couldn't load the session log from the server. Reload to try again.</div>
</div>

<div id="summary-bar">
  <div class="summary-stat"><div class="summary-stat-label">Sessions logged</div><div class="summary-stat-value" id="stat-count">0</div></div>
  <div class="summary-stat"><div class="summary-stat-label">Total XP awarded</div><div class="summary-stat-value" id="stat-xp">0</div></div>
</div>

<div id="panel">
  <div id="new-form-slot"></div>
  <div id="sessions-list"></div>
  <div id="empty-state" style="display:none;">
    <div class="es-icon">📓</div>
    No sessions logged yet — recap your first session to start the log.
  </div>
</div>

<script src="session-log.js"></script>
</body>
</html>
