name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate campaign/character JSON
        run: |
          python3 -c "
          import json, glob, sys
          files = glob.glob('CAMPAIGN/*.json') + glob.glob('CLASS-1A/*.json')
          bad = []
          for f in files:
              try:
                  with open(f, encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('Malformed JSON:')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'{len(files)} JSON files OK')
          "
      - name: Verify page JavaScript parses
        run: node scripts/verify-js-syntax.js

      - name: Verify Firestore merge-save safety
        run: node scripts/verify-merge-safety.js

      - name: Verify relationship live-sync safety
        run: node scripts/verify-relationship-sync.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the version number below counts commits;
      # the default shallow clone would report 1 every time.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stamps version.json on every deploy so the dashboard badge moves
      # forward on its own. The repo also carries a checked-in version.json
      # as a fallback for local dev (python3 server.py), which this
      # overwrites in the built artifact only -- nothing is committed back.
      - name: Stamp build version
        run: |
          BUILD=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > version.json <<JSON
          {
            "version": "1.0.$BUILD",
            "build": $BUILD,
            "commit": "$SHA",
            "built": "$BUILT"
          }
          JSON
          echo "Stamped version 1.0.$BUILD ($SHA)"
          cat version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
