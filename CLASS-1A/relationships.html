<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Class 1-A toolkit — character sheets, quirk mechanics, relationship tracker, and dice roller.">
<meta name="theme-color" content="#0C1017">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>Class 1-A — DM Toolkit</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0C1017; --surface: #111923; --surface2: #18222E;
    --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.14);
    --text: #E8EDF3; --text-muted: #8A9BB0; --text-dim: #3E5068;
    --accent: #E8A020; --accent-light: rgba(232,160,32,0.13); --accent-text: #F5C842;
    --teal: #0EA572; --teal-light: rgba(14,165,114,0.13); --teal-text: #5FDBAA;
    --red: #EF4444; --red-light: rgba(239,68,68,0.13); --red-text: #FCA5A5;
    --amber: #F59E0B; --amber-light: rgba(245,158,11,0.13); --amber-text: #FDE68A;
    --green: #22C55E; --green-light: rgba(34,197,94,0.13); --green-text: #86EFAC;
    --radius: 8px; --radius-lg: 12px;
    --gold-glow: rgba(232,160,32,0.15);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

  /* ── Sidebar ──────────────────────────────────────────── */
  #sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #sidebar-header {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    border-top: 3px solid var(--accent);
    background: linear-gradient(180deg, rgba(232,160,32,0.07) 0%, transparent 100%);
  }
  #sidebar-header h1 { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  #sidebar-header p { font-size: 10px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
  #search { margin: 8px 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: 12px; width: calc(100% - 24px); outline: none; }
  #search:focus { border-color: var(--accent); }
  #char-list { overflow-y: auto; flex: 1; }
  .section-label { padding: 6px 16px 2px; font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.07em; text-transform: uppercase; }
  .char-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; border-left: 2px solid transparent; transition: background 0.1s; }
  .char-item:hover { background: var(--surface2); }
  .char-item.active { background: var(--accent-light); border-left-color: var(--accent); }
  .char-item.active .char-name { color: var(--accent-text); }
  .char-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .av-pc { background: var(--accent-light); color: var(--accent-text); }
  .av-npc { background: var(--teal-light); color: var(--teal-text); }
  .char-info .char-name { font-size: 13px; font-weight: 500; }
  .char-info .char-quirk { font-size: 12px; color: var(--text-muted); }
  .av-1b       { background: var(--amber-light); color: var(--amber-text); }
  .av-teacher  { background: var(--green-light); color: var(--green-text); }
  .av-villain  { background: var(--red-light); color: var(--red-text); }
  .av-supporting { background: rgba(99,102,241,0.13); color: #a5b4fc; }

  /* ── Section filter pills ─────────────────────────────── */
  #section-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 4px; flex-shrink: 0; }
  .sf-pill { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-dim); cursor: pointer; font-family: inherit;
    transition: background 0.1s, color 0.1s, border-color 0.1s; }
  .sf-pill:hover { color: var(--text-muted); border-color: var(--border-strong); }
  .sf-pill.sf-active { background: var(--accent-light); color: var(--accent-text); border-color: rgba(232,160,32,0.4); }

  /* ── Main nav ─────────────────────────────────────────── */
  #main { display: flex; flex-direction: column; overflow: hidden; }
  #main-nav { display: flex; align-items: center; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #back-to-dash { display: flex; align-items: center; gap: 5px; padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-dim); text-decoration: none; border-right: 1px solid var(--border); white-space: nowrap; text-transform: uppercase; }
  #back-to-dash:hover { color: var(--accent); background: var(--accent-light); }
  .nav-right { display: flex; align-items: center; gap: 8px; padding: 0 16px; margin-left: auto; flex-shrink: 0; }
  .nav-btn { padding: 10px 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; border: none; background: none; color: var(--text-dim); border-bottom: 2px solid transparent; transition: color 0.1s; }
  .nav-btn:hover { color: var(--text-muted); }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .main-view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .main-view.active { display: flex; }

  /* ── Profile (Characters view) ────────────────────────── */
  #profile { flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  #profile-inner { padding: 16px 20px 12px; display: flex; gap: 16px; align-items: flex-start; }
  #profile-avatar { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; flex-shrink: 0; border: 2px solid var(--border-strong); }
  #profile-body { flex: 1; min-width: 0; }
  #profile-name { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .name-input { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 4px; outline: none; padding: 1px 4px; margin: -1px -4px; }
  .name-input:hover { border-color: var(--border); }
  .name-input:focus { border-color: var(--accent); color: var(--accent-text); }
  #profile-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.05em; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  #profile-sub .sub-sep { opacity: 0.6; }
  .sub-input, .sub-select { font: inherit; text-transform: uppercase; letter-spacing: inherit; color: var(--text-dim); background: transparent; border: 1px solid transparent; border-radius: 4px; outline: none; padding: 1px 3px; }
  .sub-input:hover, .sub-select:hover { border-color: var(--border); }
  .sub-input:focus, .sub-select:focus { border-color: var(--accent); color: var(--accent-text); }
  .sub-input-quirk { width: 90px; }
  .sub-input-narrow { width: 54px; }
  .sub-select { cursor: pointer; }
  .sub-select option { background: var(--surface2); color: var(--text); text-transform: none; }
  #tags-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--text-dim); background: var(--surface2); letter-spacing: 0.04em; font-weight: 600; text-transform: uppercase; }
  .tag-pc { background: var(--accent-light); color: var(--accent-text); border-color: rgba(232,160,32,0.3); }
  .edit-wrap { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .edit-wrap label { white-space: nowrap; font-weight: 600; letter-spacing: 0.03em; }
  .stat-input { width: 38px; padding: 1px 2px; border: none; background: transparent; color: var(--text); font-size: 11px; font-weight: 700; outline: none; text-align: center; }
  .stat-input:focus { color: var(--accent); }
  .class-input { width: 130px; padding: 1px 2px; border: none; background: transparent; color: var(--text); font-size: 11px; font-weight: 700; outline: none; }
  .class-input:focus { color: var(--accent); }
  .stat-chip { font-size: 11px; font-weight: 700; padding: 2px 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); white-space: nowrap; }
  .profile-action-btn { font-size: 11px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface2); color: var(--text-muted); cursor: pointer; transition: background 0.1s, color 0.1s; white-space: nowrap; }
  .profile-action-btn:hover { background: var(--accent-light); color: var(--accent-text); border-color: var(--accent); }
  #scores-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .score-block { display: flex; flex-direction: column; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 8px; min-width: 46px; }
  .score-label { font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .score-val-input { width: 36px; font-size: 16px; font-weight: 800; color: var(--text); text-align: center; border: none; background: transparent; outline: none; padding: 0; }
  .score-val-input:focus { color: var(--accent); }
  .score-mod { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  #profile-tabs { display: flex; border-top: 1px solid var(--border); overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #profile-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 8px 16px; font-size: 12px; cursor: pointer; border: none; background: none; color: var(--text-dim); border-bottom: 2px solid transparent; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  #tab-content { padding: 12px 20px; font-size: 14px; color: var(--text-muted); line-height: 1.6; max-height: 160px; overflow-y: auto; background: var(--surface); border-bottom: 1px solid var(--border); }
  #tab-content.tab-quirk { max-height: 320px; }
  #tab-content.tab-attacks { max-height: 400px; }
  #tab-content.tab-inventory { max-height: 400px; }
  .tab-editable { width: 100%; min-height: 90px; font-size: 13px; line-height: 1.6; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); resize: vertical; outline: none; font-family: inherit; }
  .tab-editable:focus { border-color: var(--accent); background: var(--surface); }
  .quirk-header { margin-bottom: 8px; }
  .quirk-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .quirk-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .weakness-block { background: var(--red-light); border-left: 3px solid var(--red); border-radius: 0 var(--radius) var(--radius) 0; padding: 6px 10px; margin-bottom: 8px; font-size: 12px; color: var(--red-text); }
  .ability-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--surface2); transition: border-color 0.15s; }
  .ability-card:last-child { margin-bottom: 0; }
  .ability-card.locked { opacity: 0.42; border-style: dashed; background: none; }
  .ability-card.locked .ability-name { color: var(--text-muted); }
  .ability-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .ability-type { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--accent-light); color: var(--accent-text); font-weight: 500; margin-left: 6px; vertical-align: middle; }
  .ability-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  .lock-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 1px 7px; border-radius: 3px; background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); margin-left: 6px; vertical-align: middle; }
  .upgrade-note { font-size: 11px; color: var(--teal); margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--border); font-style: italic; }
  .player-note { background: var(--amber-light); border-left: 3px solid var(--amber); border-radius: 0 var(--radius) var(--radius) 0; padding: 6px 10px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
  .player-note strong { color: var(--text); }
  .ability-card-editable { display: flex; flex-direction: column; gap: 6px; border-color: var(--border); }
  .ability-card-editable:focus-within { border-color: var(--accent); }
  .ability-edit-row { display: flex; align-items: center; gap: 6px; }
  .ability-input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; color: var(--text); font-family: inherit; width: 100%; resize: vertical; transition: border-color 0.15s; }
  .ability-input:focus { outline: none; border-color: var(--accent); }
  .ability-input-name { flex: 1; font-weight: 600; }
  .ability-input-type { font-size: 11px; color: var(--text-muted); }
  .ability-input-desc { min-height: 44px; }
  .ability-delete-btn { flex-shrink: 0; color: var(--red-text); }
  .ability-delete-btn:hover { background: var(--red-light); border-color: var(--red); }
  .add-attack-btn { width: 100%; padding: 9px; border: 1px dashed var(--border); border-radius: var(--radius); background: none; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .add-attack-btn:hover { background: var(--surface2); color: var(--accent-text); border-color: var(--accent); }

  /* ── Inventory ────────────────────────────────────────── */
  .inv-currency-panel { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; background: var(--surface2); }
  .inv-currency-title { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 8px; }
  .inv-currency-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .inv-currency-block { display: flex; flex-direction: column; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 6px; min-width: 68px; }
  .inv-currency-block label { font-size: 9px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; }
  .inv-currency-input { width: 64px; font-size: 15px; font-weight: 700; color: var(--text); text-align: center; border: none; background: transparent; outline: none; padding: 0; font-family: inherit; }
  .inv-currency-input:focus { color: var(--accent); }
  .inv-currency-input:disabled { color: var(--text-muted); }
  .inv-currency-total { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  .inv-currency-total strong { color: var(--teal-text); }
  .inv-items-title { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 8px; }
  .inv-item-qty { flex-shrink: 0; width: 52px !important; text-align: center; }
  .inv-empty { color: var(--text-dim); font-style: italic; font-size: 12px; }

  /* ── Relationships ────────────────────────────────────── */
  #rel-section { flex: 1; overflow-y: auto; }
  #rel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  #rel-header h2 { font-size: 13px; font-weight: 600; }
  #rel-legend { display: flex; gap: 12px; }
  .leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }
  #rel-list { padding: 0 20px 24px; }
  #rel-list.collapsed { display: none; }
  #rel-toggle-btn.collapsed { transform: rotate(-90deg); }
  #rel-section.collapsed { flex: 0 0 auto; margin-top: auto; overflow-y: visible; }
  #profile.expanded { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #profile.expanded #tab-content { flex: 1; max-height: none; }
  .rel-row { display: grid; grid-template-columns: 180px 1fr 52px; align-items: start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .rel-row:last-child { border-bottom: none; }
  .rel-char-name { font-size: 13px; font-weight: 500; }
  .rel-char-quirk { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .rel-controls { display: flex; flex-direction: column; gap: 4px; }
  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  .rel-slider { flex: 1; accent-color: var(--accent); cursor: pointer; touch-action: pan-y; }
  .rel-score { font-size: 14px; font-weight: 600; text-align: center; padding-top: 2px; min-width: 32px; }
  .score-neg { color: var(--red); }
  .score-zero { color: var(--text-dim); }
  .score-pos { color: var(--accent); }
  .rel-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); padding: 0 1px; }
  .rel-note { font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); width: 100%; resize: none; outline: none; font-family: inherit; min-height: 28px; }
  .rel-note:focus { border-color: var(--accent); background: var(--surface); }

  /* ── Dice view ────────────────────────────────────────── */
  #view-dice { padding: 24px; overflow-y: auto; gap: 20px; }
  .dice-section-title { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 10px; }
  .dice-tray { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .die-btn { width: 68px; height: 68px; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); color: var(--text-muted); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: border-color 0.12s, background 0.12s, box-shadow 0.12s; }
  .die-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent-text); box-shadow: 0 0 12px var(--gold-glow); }
  .die-btn.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent-text); box-shadow: 0 0 16px var(--gold-glow); }
  .die-btn .die-face { font-size: 22px; }
  .dice-controls { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .counter-group { display: flex; align-items: center; gap: 8px; }
  .counter-label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .counter-btn { width: 28px; height: 28px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .counter-btn:hover { background: var(--surface); border-color: var(--accent); }
  .counter-val { font-size: 15px; font-weight: 700; min-width: 28px; text-align: center; }
  .roll-btn { padding: 10px 28px; background: var(--accent); color: #0C1017; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: opacity 0.1s, box-shadow 0.1s; box-shadow: 0 0 16px var(--gold-glow); }
  .roll-btn:hover { opacity: 0.9; box-shadow: 0 0 24px rgba(232,160,32,0.3); }
  .adv-btn { padding: 4px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface2); color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.1s, color 0.1s, border-color 0.1s; }
  .adv-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-light); }
  .adv-btn.active { background: var(--accent-light); color: var(--accent-text); border-color: var(--accent); box-shadow: 0 0 8px var(--gold-glow); }
  .dice-result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 20px; min-height: 88px; display: flex; align-items: center; gap: 20px; }
  .result-number { font-size: 56px; font-weight: 800; color: var(--text); line-height: 1; min-width: 80px; letter-spacing: -0.02em; }
  .result-number.crit { color: var(--green); text-shadow: 0 0 20px rgba(34,197,94,0.4); }
  .result-number.fumble { color: var(--red); text-shadow: 0 0 20px rgba(239,68,68,0.4); }
  .result-detail { font-size: 13px; color: var(--text-muted); }
  .result-label { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .result-breakdown { font-size: 14px; color: var(--text); margin-top: 2px; font-weight: 600; }
  .crit-label { font-size: 12px; font-weight: 700; color: var(--green); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  .fumble-label { font-size: 12px; font-weight: 700; color: var(--red); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  .dice-history { display: flex; flex-direction: column; gap: 4px; }
  .history-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); font-size: 12px; }
  .history-die { font-size: 10px; font-weight: 700; color: var(--accent-text); background: var(--accent-light); padding: 1px 6px; border-radius: 3px; letter-spacing: 0.04em; }
  .history-total { font-size: 14px; font-weight: 800; color: var(--text); min-width: 32px; }
  .history-breakdown { color: var(--text-muted); flex: 1; }
  .history-crit { color: var(--green); font-weight: 700; }
  .history-fumble { color: var(--red); font-weight: 700; }

  /* ── Save bar ─────────────────────────────────────────── */
  #save-bar { display: flex; align-items: center; gap: 8px; padding: 6px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  #save-bar span { font-size: 10px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.04em; }
  #save-status { margin-left: auto; font-size: 10px; color: var(--text-dim); transition: color 0.3s; font-weight: 700; letter-spacing: 0.04em; }
  #save-status.saving { color: var(--amber); }
  #save-status.saved { color: var(--teal); }
  #save-status.error { color: var(--red); }

  /* ── Mobile ──────────────────────────────────────────── */
  @media (max-width: 640px) {
    body { height: 100dvh; }
    #app { grid-template-columns: 1fr; position: relative; overflow: hidden; }

    /* Sidebar: full screen, slides left when main is shown */
    #sidebar {
      position: absolute; inset: 0; z-index: 10; width: 100%; border-right: none;
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    #app.mobile-main #sidebar { transform: translateX(-100%); pointer-events: none; }

    /* Main: full screen, slides in from right */
    #main {
      position: absolute; inset: 0;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    #app.mobile-main #main { transform: translateX(0); }

    /* Sidebar quick-nav for tools without a character */
    #sidebar-mobile-nav {
      display: flex; gap: 6px; padding: 8px 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .sidebar-mobile-btn {
      flex: 1; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface2); color: var(--text-muted);
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer;
      text-transform: uppercase; font-family: inherit;
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }
    .sidebar-mobile-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-light); }

    /* Main nav: hide dashboard link, show back-to-list button */
    #back-to-dash { display: none; }
    #mobile-back-btn {
      display: flex; align-items: center; padding: 10px 12px; gap: 4px;
      font-size: 12px; font-weight: 600; color: var(--text-dim); background: none;
      border: none; border-right: 1px solid var(--border); cursor: pointer;
      white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em;
      font-family: inherit; flex-shrink: 0;
    }
    #mobile-back-btn:hover { color: var(--accent-text); background: var(--accent-light); }
    #main-nav { overflow-x: auto; scrollbar-width: none; }
    #main-nav::-webkit-scrollbar { display: none; }
    .nav-btn { padding: 10px 14px; white-space: nowrap; flex-shrink: 0; }

    /* Profile header */
    #profile-inner { padding: 12px 14px 8px; }
    #profile-name { font-size: 17px; }
    #scores-row { gap: 4px; }
    .score-block { padding: 4px 5px; min-width: 40px; }
    .score-val-input { font-size: 14px; width: 30px; }
    .stat-chip { font-size: 10px; }

    /* Profile tabs: horizontally scrollable */
    #profile-tabs { flex-shrink: 0; }
    .tab-btn { padding: 7px 10px; }
    #tab-content { max-height: 180px; padding: 10px 14px; }
    #tab-content.tab-quirk { max-height: 240px; }

    /* Relationships: stack name+score on one row, controls below */
    #rel-list { padding: 0 14px 24px; }
    #rel-header { padding: 8px 14px; }
    #rel-legend { display: none; }
    .rel-row {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 10px;
      padding: 16px 0;
    }
    .rel-row > :nth-child(1) { grid-column: 1; grid-row: 1; }
    .rel-row > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
    .rel-row > :nth-child(3) { grid-column: 2; grid-row: 1; align-self: center; }
    .slider-wrap { padding: 8px 0; margin: 2px 0; }
    .rel-slider { height: 32px; }
    .rel-note { min-height: 34px; padding: 8px; }

    /* Dice roller */
    #view-dice { padding: 14px; gap: 14px; }
    .die-btn { width: 58px; height: 58px; }
    .dice-result { padding: 14px 16px; }
    .result-number { font-size: 44px; min-width: 60px; }
    .dice-tray { padding: 0 !important; }
    .dice-section-title { padding: 0 !important; }


    /* Save bar */
    #save-bar { padding: 6px 12px; }

  }

  @media (min-width: 641px) {
    #mobile-back-btn { display: none; }
    #sidebar-mobile-nav { display: none; }
  }
</style>

  const db = firebase.firestore();
</script>

<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>U.A. High School</h1>
      <p>Hero Course — Class 1-A</p>
    </div>
    <div id="sidebar-mobile-nav">
      <button class="sidebar-mobile-btn" onclick="mobileFwd('dice')">⚄ Dice</button>
    </div>
    <input id="search" type="text" placeholder="Search characters..." autocomplete="off" oninput="filterList(this.value)">
    <div id="char-list"></div>
  </div>

  <div id="main">
    <div id="main-nav">
      <a id="back-to-dash" href="../index.html">← Dashboard</a>
      <button id="mobile-back-btn" onclick="mobileBack()">← List</button>
      <button class="nav-btn active" onclick="setView('character')">Characters</button>
      <button class="nav-btn" onclick="setView('dice')">Dice Roller</button>
      <div class="nav-right"></div>
    </div>

    <!-- ── Character view ── -->
    <div id="view-character" class="main-view active">
      <div id="profile">
        <div id="profile-inner">
          <div id="profile-avatar"></div>
          <div id="profile-body">
            <div id="profile-name"></div>
            <div id="profile-sub"></div>
            <div id="tags-row"></div>
            <div id="scores-row"></div>
          </div>
        </div>
        <div id="profile-tabs">
          <button class="tab-btn active" onclick="showTab('personality')">Personality</button>
          <button class="tab-btn" onclick="showTab('appearance')">Appearance</button>
          <button class="tab-btn" onclick="showTab('combat')">Combat role</button>
          <button class="tab-btn" onclick="showTab('social')">Social role</button>
          <button class="tab-btn" onclick="showTab('attacks')">Attacks</button>
          <button class="tab-btn" onclick="showTab('inventory')">Inventory</button>
          <button class="tab-btn" onclick="showTab('background')">Background</button>
          <button class="tab-btn" onclick="showTab('additionalfeatures')">Additional features</button>
        </div>
        <div id="tab-content"></div>
      </div>
      <div id="rel-section">
        <div id="rel-header">
          <h2 id="rel-heading">Relationships</h2>
          <div id="rel-legend">
            <div class="leg"><div class="leg-dot" style="background:var(--red)"></div>Hostile</div>
            <div class="leg"><div class="leg-dot" style="background:var(--text-dim)"></div>Neutral</div>
            <div class="leg"><div class="leg-dot" style="background:var(--accent)"></div>Positive</div>
          </div>
          <button id="rel-toggle-btn" class="enc-btn" onclick="toggleRelCollapse()" title="Show/hide classmates" style="margin-left:10px;">▾</button>
        </div>
        <div id="rel-list"></div>
      </div>
    </div>

    <!-- ── Dice Roller view ── -->
    <div id="view-dice" class="main-view">
      <p class="dice-section-title" style="padding:24px 24px 0">Choose die</p>
      <div class="dice-tray" style="padding:0 24px">
        <button class="die-btn selected" onclick="selectDie(4, this)"><span class="die-face">⟁</span>d4</button>
        <button class="die-btn" onclick="selectDie(6, this)"><span class="die-face">⬡</span>d6</button>
        <button class="die-btn" onclick="selectDie(8, this)"><span class="die-face">◆</span>d8</button>
        <button class="die-btn" onclick="selectDie(10, this)"><span class="die-face">◈</span>d10</button>
        <button class="die-btn" onclick="selectDie(12, this)"><span class="die-face">⬠</span>d12</button>
        <button class="die-btn" onclick="selectDie(20, this)"><span class="die-face">⬟</span>d20</button>
      </div>
      <div class="dice-adv-row" style="padding:8px 24px 0;display:flex;gap:6px;align-items:center;">
        <button class="adv-btn" id="dice-adv-btn" onclick="toggleAdvMode('adv')" title="Advantage: roll 2d20, take highest (d20 only)">Adv</button>
        <button class="adv-btn" id="dice-dis-btn" onclick="toggleAdvMode('dis')" title="Disadvantage: roll 2d20, take lowest (d20 only)">Dis</button>
        <span id="adv-hint" style="font-size:10px;color:var(--text-dim);display:none;">d20 only</span>
      </div>
      <div class="dice-controls" style="padding:10px 24px 0">
        <div class="counter-group">
          <span class="counter-label">Dice</span>
          <button class="counter-btn" onclick="adjustDice(-1)">−</button>
          <span class="counter-val" id="dice-count">1</span>
          <button class="counter-btn" onclick="adjustDice(1)">+</button>
        </div>
        <div class="counter-group">
          <span class="counter-label">Modifier</span>
          <button class="counter-btn" onclick="adjustMod(-1)">−</button>
          <span class="counter-val" id="dice-mod">0</span>
          <button class="counter-btn" onclick="adjustMod(1)">+</button>
        </div>
        <button class="roll-btn" onclick="rollDice()" id="roll-btn">Roll 1d4</button>
      </div>
      <div class="dice-expr-row" style="padding:10px 24px 0;display:flex;gap:6px;align-items:center;">
        <input id="dice-expr-inp" type="text" placeholder="e.g. 2d6 + 3" title="Dice expression"
          style="flex:1;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;outline:none;"
          onkeydown="if(event.key==='Enter')rollExpr()">
        <button class="roll-btn" style="white-space:nowrap;padding:5px 14px;" onclick="rollExpr()">Roll Expr</button>
      </div>
      <div class="dice-result" style="margin:14px 24px 0" id="dice-result">
        <div style="color:var(--text-dim);font-size:13px;">Select a die and roll</div>
      </div>
      <p class="dice-section-title" style="padding:0 24px 6px">Recent rolls</p>
      <div class="dice-history" style="padding:0 24px 24px" id="dice-history"></div>
    </div>

    <div id="save-bar">
      <span>Syncs via Firestore</span>
      <div style="display:flex;gap:6px;margin-left:auto;align-items:center;">
        <button onclick="exportData()" style="padding:3px 10px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text-muted);cursor:pointer;" title="Download a local backup">↓ Export</button>
        <label style="padding:3px 10px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text-muted);cursor:pointer;" title="Restore from a backup file">↑ Import<input type="file" accept=".json" onchange="importData(this)" style="display:none"></label>
        <span id="save-status"></span>
      </div>
    </div>

  </div>
</div>

<script>
const STAT_KEYS = ['STR','DEX','CON','INT','WIS','CHA','TECH'];
let CHARACTERS = [];
let selected = null;
let activeTab = 'personality';
let rels = {};
let fsSaveTimer = null;
let currentView = 'character';

const SECTION_ORDER  = ['class-1a'];

/* ── Save status ──────────────────────────────────────── */
function setSaveStatus(state, text) {
  const el = document.getElementById('save-status');
  el.className = state;
  el.textContent = text;
}

/* ── Firestore storage ────────────────────────────────── */
const FS_COLLECTION = 'mha-dnd';
const FS_DOC        = 'relationships-bundle';

let canWrite = false;

document.addEventListener('auth-state-changed', (e) => {
  canWrite = e.detail.role === 'admin' || e.detail.role === 'editor';
  if (selected) showTab(activeTab);
});

function buildBundle() {
  const characters = {};
  for (const c of CHARACTERS) { if (c._file) characters[c._file] = c; }
  return { version: 1, exported_at: new Date().toISOString(), relationships: rels, characters };
}

const FS_REL_DOC = db.collection(FS_COLLECTION).doc(FS_DOC);

async function saveToFirestore() {
  await fbAuthReady;
  // merge:true so a tab with a stale/partial local copy can't wipe out
  // characters or relationships it doesn't currently know about.
  await FS_REL_DOC.set(buildBundle(), { merge: true });
}

async function loadFromFirestore() {
  await fbAuthReady;
  const snap = await FS_REL_DOC.get();
  if (!snap.exists) return null;
  const parsed = snap.data();
  return (parsed.version === 1 && parsed.characters) ? parsed : null;
}

// Live feed: pull in other tabs' character/relationship saves so this tab's
// local copy never goes stale and clobbers them on its own next save.
let _pendingRemoteRelBundle = null;
function isProfileEditing() {
  const tag = document.activeElement?.tagName;
  if (tag !== 'INPUT' && tag !== 'TEXTAREA') return false;
  return !!document.activeElement.closest('#profile, #view-relationships');
}
function applyRemoteRelBundle(data) {
  rels = data.relationships || {};
  for (const c of CHARACTERS) {
    if (c._file && data.characters?.[c._file]) {
      const f = c._file, rid = c._roster_id, sec = c._section;
      Object.assign(c, data.characters[c._file]);
      c._file = f; c._roster_id = rid; c._section = sec;
    }
  }
  if (selected) renderProfile();
  renderRelationships();
  refreshSidebar();
}
async function startRelLiveSync() {
  await fbAuthReady;
  FS_REL_DOC.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    if (data.version !== 1 || !data.characters) return;
    if (isProfileEditing()) { _pendingRemoteRelBundle = data; return; }
    applyRemoteRelBundle(data);
  });
}
setInterval(() => {
  if (_pendingRemoteRelBundle && !isProfileEditing()) {
    applyRemoteRelBundle(_pendingRemoteRelBundle);
    _pendingRemoteRelBundle = null;
  }
}, 1500);

function scheduleFirestoreSave() {
  clearTimeout(fsSaveTimer);
  setSaveStatus('saving', 'Saving…');
  fsSaveTimer = setTimeout(async () => {
    try {
      await saveToFirestore();
      setSaveStatus('saved', 'Saved ' + new Date().toLocaleTimeString());
    } catch (e) { setSaveStatus('error', e.message); }
  }, 600);
}

/* ── View switching ───────────────────────────────────── */
function setView(view) {
  currentView = view;
  document.querySelectorAll('.main-view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['character','dice'][i] === view);
  });
}

/* ── Relationships persistence ────────────────────────── */
function relKey(from, to) { return from + ':' + to; }
function getRel(fromId, toId) { return rels[relKey(fromId, toId)] || { score: 0, note: '' }; }

function setRelScore(fromId, toId, score) {
  const k = relKey(fromId, toId);
  rels[k] = rels[k] || { score: 0, note: '' };
  rels[k].score = Math.max(-10, Math.min(10, parseInt(score) || 0));
  updateScoreDisplay(fromId, toId, score);
  scheduleFirestoreSave();
}
function setRelNote(fromId, toId, note) {
  const k = relKey(fromId, toId);
  rels[k] = rels[k] || { score: 0, note: '' };
  rels[k].note = note;
  scheduleFirestoreSave();
}
function updateScoreDisplay(fromId, toId, score) {
  const el = document.getElementById('score-'+fromId+'-'+toId);
  if (!el) return;
  score = parseInt(score);
  el.textContent = score > 0 ? '+'+score : ''+score;
  el.className = 'rel-score '+(score<0?'score-neg':score>0?'score-pos':'score-zero');
}

/* ── Character persistence ────────────────────────────── */
function scheduleCharSave(c) { scheduleFirestoreSave(); }

function onStatChange(field, value, isFloat) {
  const c = selected;
  const num = isFloat ? parseFloat(value) : parseInt(value);
  if (isNaN(num)) return;
  c[field] = num;
  scheduleCharSave(c);
}
function onAbilityScoreChange(key, value) {
  const c = selected;
  const num = parseInt(value);
  if (isNaN(num)) return;
  c.ability_scores[key] = num;
  const mod = Math.floor((num - 10) / 2);
  c.modifiers[key] = mod;
  const modEl = document.getElementById('mod-'+key);
  if (modEl) modEl.textContent = (mod>=0?'+':'')+mod;
  scheduleCharSave(c);
}
function onClassChange(value) { selected.suggested_class = value; scheduleCharSave(selected); }

function refreshSidebar() {
  renderSidebar();
  filterList(document.getElementById('search').value);
}

function onNameChange(value) {
  const v = value.trim();
  if (!v) { renderProfile(); return; }
  selected.name = v;
  scheduleCharSave(selected);
  document.getElementById('profile-avatar').textContent = initials(selected.name);
  refreshSidebar();
}
function onSubFieldChange(field, value) {
  selected[field] = value;
  scheduleCharSave(selected);
  if (field === 'quirk') refreshSidebar();
}
function onCategoryChange(value) {
  selected.is_pc = value === 'pc';
  scheduleCharSave(selected);
  refreshSidebar();
  renderProfile();
}

/* ── Sidebar ──────────────────────────────────────────── */
function initials(name) { return name.split(' ').slice(0,2).map(w=>w[0]).join(''); }

const AV_CLASS = { 'class-1a': c => c.is_pc ? 'av-pc' : 'av-npc' };

function renderSidebar() {
  const visible = CHARACTERS;

  let html = '';
  const pcs = visible.filter(c => c.is_pc), npcs = visible.filter(c => !c.is_pc);
  if (pcs.length)  { html += '<div class="section-label">Player Characters</div>'; for (const c of pcs)  html += charItem(c); }
  if (npcs.length) { html += '<div class="section-label">Class 1-A</div>'; for (const c of npcs) html += charItem(c); }
  document.getElementById('char-list').innerHTML = html;
}

function charItem(c) {
  const av = (AV_CLASS[c._section] || (()=>'av-npc'))(c);
  const active = selected && c._roster_id === selected._roster_id ? ' active' : '';
  const sub = c._alias ? c._alias : c.quirk;
  return `<div class="char-item${active}" onclick="selectChar(${c._roster_id})" id="item-${c._roster_id}">
    <div class="char-avatar ${av}">${initials(c.name)}</div>
    <div class="char-info"><div class="char-name">${c.name}</div><div class="char-quirk">${sub}</div></div>
  </div>`;
}

function selectChar(id) {
  selected = CHARACTERS.find(c => c._roster_id === id);
  document.querySelectorAll('.char-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById('item-'+id);
  if (item) item.classList.add('active');
  activeTab = 'personality';
  renderProfile();
  renderRelationships();
  setView('character');
  if (window.innerWidth <= 640) document.getElementById('app').classList.add('mobile-main');
}

function mobileBack() {
  document.getElementById('app').classList.remove('mobile-main');
}

function mobileFwd(view) {
  setView(view);
  document.getElementById('app').classList.add('mobile-main');
}

function filterList(q) {
  const query = q.toLowerCase();
  document.querySelectorAll('.char-item').forEach(el => {
    const name = el.querySelector('.char-name').textContent.toLowerCase();
    const quirk = el.querySelector('.char-quirk').textContent.toLowerCase();
    el.style.display = (name.includes(query)||quirk.includes(query)) ? '' : 'none';
  });
  document.querySelectorAll('.section-label').forEach(el => el.style.display = q ? 'none' : '');
}

/* ── Profile ──────────────────────────────────────────── */
function renderProfile() {
  const c = selected;
  const avEl = document.getElementById('profile-avatar');
  avEl.textContent = initials(c.name);
  const SEC_COLORS = { 'class-1a': c.is_pc ? ['var(--accent-light)','var(--accent-text)'] : ['var(--teal-light)','var(--teal-text)'], 'class-1b': ['var(--amber-light)','var(--amber-text)'], teachers: ['var(--green-light)','var(--green-text)'], villains: ['var(--red-light)','var(--red-text)'], supporting: ['rgba(99,102,241,0.13)','#a5b4fc'] };
  const [avBg, avColor] = SEC_COLORS[c._section || 'class-1a'] || SEC_COLORS['class-1a'];
  avEl.style.background = avBg; avEl.style.color = avColor;
  document.getElementById('profile-name').innerHTML =
    `<input class="name-input" type="text" value="${escHtml(c.name||'')}" onchange="onNameChange(this.value)" title="Character name">`;

  document.getElementById('profile-sub').innerHTML = `
    <input class="sub-input sub-input-quirk" type="text" value="${escHtml(c.quirk||'')}" placeholder="Quirk" onchange="onSubFieldChange('quirk',this.value)" title="Quirk">
    <span class="sub-sep">·</span>
    <select class="sub-select" onchange="onCategoryChange(this.value)" title="Category">
      <option value="npc" ${!c.is_pc?'selected':''}>Class 1-A</option>
      <option value="pc" ${c.is_pc?'selected':''}>Player Character</option>
    </select>
    <span class="sub-sep">·</span>
    <input class="sub-input" type="text" value="${escHtml(c.physiology||'')}" placeholder="Physiology" onchange="onSubFieldChange('physiology',this.value)" title="Physiology">
    <span class="sub-sep">·</span>
    <input class="sub-input sub-input-narrow" type="text" value="${escHtml(c.height||'')}" placeholder="Height" onchange="onSubFieldChange('height',this.value)" title="Height">
    <span class="sub-sep">·</span>
    <input class="sub-input sub-input-narrow" type="text" value="${escHtml(c.gender||'')}" placeholder="Gender" onchange="onSubFieldChange('gender',this.value)" title="Gender">
  `;

  const tags = document.getElementById('tags-row');
  const lv = c.level || 1;
  const prof = Math.floor((lv - 1) / 4) + 2;
  const wisMod = (c.modifiers || {}).WIS ?? Math.floor(((c.ability_scores || {}).WIS ?? 10) - 10) / 2 | 0;
  const passivePerc = 10 + wisMod + prof;
  let tagHtml = '';
  if (c.is_pc) tagHtml += '<span class="tag tag-pc">PC</span>';
  tagHtml += `<div class="edit-wrap"><label>Lv</label><input class="stat-input" type="number" min="1" max="20" value="${lv}" onchange="onStatChange('level',this.value,false)" title="Level"></div>`;
  tagHtml += `<div class="edit-wrap"><label>HP</label><input class="stat-input" type="number" min="1" value="${c.HP||10}" onchange="onStatChange('HP',this.value,false)" title="Max HP"></div>`;
  tagHtml += `<div class="edit-wrap"><label>AC</label><input class="stat-input" type="number" min="1" value="${c.AC||10}" onchange="onStatChange('AC',this.value,false)" title="Armour Class"></div>`;
  tagHtml += `<div class="edit-wrap"><label>Class</label><input class="class-input" type="text" value="${escHtml(c.suggested_class||'')}" onchange="onClassChange(this.value)" title="Class"></div>`;
  tagHtml += `<div class="stat-chip" title="Proficiency bonus (level ${lv})">Prof +${prof}</div>`;
  tagHtml += `<div class="stat-chip" title="Passive Perception = 10 + WIS mod + Prof">Passive ${passivePerc}</div>`;
  tagHtml += `<button class="profile-action-btn" onclick="copyStatBlock()" title="Copy stat block to clipboard">⧉ Copy</button>`;
  tags.innerHTML = tagHtml;

  const sc = c.ability_scores || {};
  const mo = c.modifiers || {};
  document.getElementById('scores-row').innerHTML = STAT_KEYS.map(k => {
    const val = sc[k] ?? 10;
    const mod = mo[k] ?? Math.floor((val-10)/2);
    return `<div class="score-block">
      <span class="score-label">${k}</span>
      <input class="score-val-input" type="number" min="1" max="30" value="${val}" onchange="onAbilityScoreChange('${k}',this.value)" title="${k}">
      <span class="score-mod" id="mod-${k}">${(mod>=0?'+':'')+mod}</span>
    </div>`;
  }).join('');

  showTab(activeTab);
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function copyStatBlock() {
  const c = selected;
  if (!c) return;
  const lv = c.level || 1;
  const prof = Math.floor((lv - 1) / 4) + 2;
  const mo = c.modifiers || {};
  const sc = c.ability_scores || {};
  const fmt = k => { const v = sc[k] ?? 10; const m = mo[k] ?? (Math.floor((v-10)/2)); return `${k} ${m>=0?'+':''}${m}`; };
  const line = `${c.name} — Lv ${lv} ${c.suggested_class||''} | HP: ${c.HP||10}  AC: ${c.AC||10}  Prof: +${prof} | ${['STR','DEX','CON','INT','WIS','CHA'].map(fmt).join('  ')}`;
  navigator.clipboard.writeText(line).then(() => {
    const btn = document.querySelector('.profile-action-btn');
    if (btn && btn.textContent.includes('Copy')) { btn.textContent = '✓ Copied'; setTimeout(() => btn.textContent = '⧉ Copy', 1500); }
  });
}

function showTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase().replace(/\s+/g,'')===tab.replace(/\s+/g,''));
  });
  const c = selected;
  if (tab==='personality') {
    return renderEditableTab((c.personality||{}).summary||'', v => { c.personality = c.personality||{}; c.personality.summary = v; });
  }
  if (tab==='appearance') {
    const app = c.appearance||{};
    return renderEditableTab([app.hair,app.build,app.other].filter(Boolean).join(' — '), v => { c.appearance = { hair: null, build: null, other: v }; });
  }
  if (tab==='combat') {
    return renderEditableTab((c.dm_notes||{}).combat_role||'', v => { c.dm_notes = c.dm_notes||{}; c.dm_notes.combat_role = v; });
  }
  if (tab==='social') {
    return renderEditableTab((c.dm_notes||{}).social_role||'', v => { c.dm_notes = c.dm_notes||{}; c.dm_notes.social_role = v; });
  }
  if (tab==='background') {
    return renderEditableTab(c.backstory||'', v => { c.backstory = v; });
  }
  if (tab==='attacks') {
    return renderAttacksTab(c);
  }
  if (tab==='inventory') {
    return renderInventoryTab(c);
  }
  if (tab==='additionalfeatures') {
    return renderEditableTab(c.additional_features||'', v => { c.additional_features = v; });

}

}

/* ══════════════════════════════════════════════════════════
   DICE ROLLER
══════════════════════════════════════════════════════════ */
let diceState = { sides: 4, count: 1, mod: 0, advMode: null }; // advMode: null | 'adv' | 'dis'
let diceHistory = [];

function toggleAdvMode(mode) {
  diceState.advMode = diceState.advMode === mode ? null : mode;
  document.getElementById('dice-adv-btn').classList.toggle('active', diceState.advMode === 'adv');
  document.getElementById('dice-dis-btn').classList.toggle('active', diceState.advMode === 'dis');
  updateRollBtn();
}

function selectDie(sides, btn) {
  diceState.sides = sides;
  document.querySelectorAll('.die-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Adv/Dis only applies to d20
  const hint = document.getElementById('adv-hint');
  if (sides !== 20 && diceState.advMode) { diceState.advMode = null; document.getElementById('dice-adv-btn').classList.remove('active'); document.getElementById('dice-dis-btn').classList.remove('active'); }
  if (hint) hint.style.display = sides === 20 ? 'none' : (diceState.advMode ? 'inline' : 'none');
  updateRollBtn();
}
function adjustDice(delta) {
  diceState.count = Math.max(1, Math.min(20, diceState.count + delta));
  document.getElementById('dice-count').textContent = diceState.count;
  updateRollBtn();
}
function adjustMod(delta) {
  diceState.mod = Math.max(-20, Math.min(20, diceState.mod + delta));
  const el = document.getElementById('dice-mod');
  el.textContent = diceState.mod >= 0 ? '+'+diceState.mod : ''+diceState.mod;
  updateRollBtn();
}
function updateRollBtn() {
  const { count, sides, mod } = diceState;
  let label = `Roll ${count}d${sides}`;
  if (mod > 0) label += ` +${mod}`;
  else if (mod < 0) label += ` ${mod}`;
  document.getElementById('roll-btn').textContent = label;
}

function rollDice() {
  const { count, sides, mod, advMode } = diceState;

  if (advMode && sides === 20) {
    const r1 = Math.floor(Math.random() * 20) + 1;
    const r2 = Math.floor(Math.random() * 20) + 1;
    const kept = advMode === 'adv' ? Math.max(r1, r2) : Math.min(r1, r2);
    const dropped = advMode === 'adv' ? Math.min(r1, r2) : Math.max(r1, r2);
    const total = kept + mod;
    const isCrit = kept === 20;
    const isFumble = kept === 1;
    const modeLabel = advMode === 'adv' ? 'Advantage' : 'Disadvantage';
    const modStr = mod !== 0 ? (mod > 0 ? ` +${mod}` : ` ${mod}`) : '';
    const label = `d20 (${modeLabel})${modStr}`;
    const entry = { label, rolls: [kept], mod, total, isCrit, isFumble, advRolls: [r1, r2], dropped, advMode };
    diceHistory.unshift(entry);
    if (diceHistory.length > 12) diceHistory.pop();
    renderDiceResult(entry);
    renderDiceHistory();
    return;
  }

  const rolls = Array.from({ length: count }, () => Math.floor(Math.random() * sides) + 1);
  const total = rolls.reduce((a, b) => a + b, 0) + mod;
  const isCrit = sides === 20 && count === 1 && rolls[0] === 20;
  const isFumble = sides === 20 && count === 1 && rolls[0] === 1;
  const label = `${count}d${sides}${mod>=0?'+'+mod:mod!==0?mod:''}`.replace('+0','');

  const entry = { label, rolls, mod, total, isCrit, isFumble };
  diceHistory.unshift(entry);
  if (diceHistory.length > 12) diceHistory.pop();

  renderDiceResult(entry);
  renderDiceHistory();
}

function rollExpr() {
  const inp = document.getElementById('dice-expr-inp');
  const raw = (inp?.value || '').trim();
  if (!raw) return;
  const m = raw.replace(/\s+/g,'').match(/^(\d+)d(\d+)([+-]\d+)?$/i);
  if (!m) {
    document.getElementById('dice-result').innerHTML = `<div style="color:var(--red-text);font-size:13px;">Invalid expression — try "2d6+3"</div>`;
    return;
  }
  const count = Math.min(parseInt(m[1]), 100);
  const sides = parseInt(m[2]);
  const mod = m[3] ? parseInt(m[3]) : 0;
  if (count < 1 || sides < 2) return;
  const rolls = Array.from({ length: count }, () => Math.floor(Math.random() * sides) + 1);
  const total = rolls.reduce((a, b) => a + b, 0) + mod;
  const isCrit = sides === 20 && count === 1 && rolls[0] === 20;
  const isFumble = sides === 20 && count === 1 && rolls[0] === 1;
  const label = `${count}d${sides}${mod>0?'+'+mod:mod<0?mod:''}`;
  const entry = { label, rolls, mod, total, isCrit, isFumble };
  diceHistory.unshift(entry);
  if (diceHistory.length > 12) diceHistory.pop();
  renderDiceResult(entry);
  renderDiceHistory();
  inp.value = '';
}

function renderDiceResult(e) {
  const modStr = e.mod > 0 ? ` + ${e.mod}` : e.mod < 0 ? ` − ${Math.abs(e.mod)}` : '';
  const numClass = e.isCrit ? 'crit' : e.isFumble ? 'fumble' : '';
  const badge = e.isCrit ? '<div class="crit-label">★ Critical!</div>' : e.isFumble ? '<div class="fumble-label">☠ Fumble!</div>' : '';
  let rollStr;
  if (e.advRolls) {
    const [a, b] = e.advRolls;
    const keptStr = `<span style="font-weight:700;color:var(--text)">${e.rolls[0]}</span>`;
    const dropStr = `<span style="text-decoration:line-through;color:var(--text-dim)">${e.dropped}</span>`;
    rollStr = e.advMode === 'adv'
      ? (a >= b ? `${keptStr}, ${dropStr}` : `${dropStr}, ${keptStr}`)
      : (a <= b ? `${keptStr}, ${dropStr}` : `${dropStr}, ${keptStr}`);
    if (e.mod !== 0) rollStr += modStr;
  } else {
    rollStr = escHtml(e.rolls.join(', ') + modStr);
  }
  document.getElementById('dice-result').innerHTML = `
    <div class="result-number ${numClass}">${e.total}</div>
    <div class="result-detail">
      <div class="result-label">${e.label}</div>
      <div class="result-breakdown">${rollStr}</div>
      ${badge}
    </div>`;
}

function renderDiceHistory() {
  const el = document.getElementById('dice-history');
  if (!diceHistory.length) { el.innerHTML = ''; return; }
  el.innerHTML = diceHistory.map(e => {
    const modStr = e.mod > 0 ? ` +${e.mod}` : e.mod < 0 ? ` ${e.mod}` : '';
    const breakdown = e.rolls.join(', ') + modStr;
    const badge = e.isCrit ? '<span class="history-crit">★ Crit</span>' : e.isFumble ? '<span class="history-fumble">☠ Fumble</span>' : '';
    return `<div class="history-row">
      <span class="history-die">${e.label}</span>
      <span class="history-total">${e.total}</span>
      <span class="history-breakdown">${escHtml(breakdown)}</span>
      ${badge}
    </div>`;
  }).join('');
}

/* ── Init ──────────────────────────────────────────────── */
(async () => {
  const rosterRes = await fetch('roster.json');
  const roster = await rosterRes.json();

  // Try Firestore first, fall back to bundled JSON files
  setSaveStatus('saving', 'Loading…');
  let fsBundle = null;
  try { fsBundle = await loadFromFirestore(); } catch {}

  if (fsBundle) {
    rels = fsBundle.relationships || {};
    CHARACTERS = (roster.students || []).filter(s => s.file).map(s => {
      const c = Object.assign({}, fsBundle.characters?.[s.file] || {});
      c._file = s.file; c._roster_id = s.id; c._section = 'class-1a';
      c.name = c.name || s.name; c.quirk = c.quirk || s.quirk;
      return c;
    }).filter(c => c.name);
    setSaveStatus('saved', 'Loaded from Firestore ✓');
  } else {
    const [relsRes, ...charResults] = await Promise.all([
      fetch('relationships.json'),
      ...(roster.students || []).filter(s => s.file).map(s =>
        fetch(s.file).then(r => r.json()).then(c => { c._file = s.file; c._roster_id = s.id; c._section = 'class-1a'; return c; }).catch(() => null)
      )
    ]);
    rels = await relsRes.json();
    CHARACTERS = charResults.filter(Boolean);
    setSaveStatus('saved', 'Firestore unreachable — loaded local');
  }

  CHARACTERS.sort((a, b) => {
    const si = SECTION_ORDER.indexOf(a._section) - SECTION_ORDER.indexOf(b._section);
    if (si !== 0) return si;
    if (a._section === 'class-1a') { if (a.is_pc !== b.is_pc) return a.is_pc ? -1 : 1; }
    return a._roster_id - b._roster_id;
  });
  selected = CHARACTERS[0];
  if (fsBundle) startRelLiveSync();
  renderSidebar();
  renderProfile();
  renderRelationships();
})();
// ── Keyboard shortcuts ─────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (inInput) return;

  if (e.key === '1') { e.preventDefault(); setView('character'); }
  else if (e.key === '2') { e.preventDefault(); setView('dice'); }
  else if ((e.key === ' ' || e.key === 'Enter') && currentView === 'dice') {
    e.preventDefault(); rollDice();
  } else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && currentView === 'character') {
    e.preventDefault();
    const idx = CHARACTERS.findIndex(c => c._roster_id === selected?._roster_id);
    if (idx === -1) return;
    const next = e.key === 'ArrowRight'
      ? CHARACTERS[(idx + 1) % CHARACTERS.length]
      : CHARACTERS[(idx - 1 + CHARACTERS.length) % CHARACTERS.length];
    selectChar(next._roster_id);
  }
});

/* ── Export / Import ──────────────────────────────────── */
function exportData() {
  setSaveStatus('saving', 'Exporting…');
  try {
    const blob = new Blob([JSON.stringify(buildBundle(), null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `mha-dnd-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    setSaveStatus('saved', 'Exported ✓');
  } catch { setSaveStatus('error', 'Export failed'); }
}

async function importData(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  if (!confirm(`Import "${file.name}"? This will overwrite all current character data and relationships.`)) return;
  setSaveStatus('saving', 'Importing…');
  try {
    const data = JSON.parse(await file.text());
    if (data.version !== 1) throw new Error('Unsupported version');
    if (data.relationships) rels = data.relationships;
    if (data.characters) {
      for (const c of CHARACTERS) {
        if (c._file && data.characters[c._file]) {
          const f = c._file, rid = c._roster_id;
          Object.assign(c, data.characters[c._file]);
          c._file = f; c._roster_id = rid;
        }
      }
    }
    await saveToFirestore();
    setSaveStatus('saved', 'Imported ✓ — reloading…');
    setTimeout(() => location.reload(), 800);
  } catch (e) { setSaveStatus('error', 'Import failed: ' + e.message); }
}
</script>
